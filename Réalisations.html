<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nos réalisations - M.D Rénovation</title>

  <meta name="description" content="Découvrez les réalisations de M.D Rénovation en Essonne : rénovation intérieure et extérieure, combles, garages, cuisines et salles de bain.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 5%;
      border-bottom: 1px solid #eee;
      background: #fff;
    }

    header img {
      width: 150px;
      height: auto;
    }

    .phone {
      background: #d71920;
      color: white;
      padding: 14px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #d71920;
    }

    .hero p {
      color: #666;
      font-size: 18px;
      max-width: 750px;
      margin: auto;
      line-height: 1.6;
    }

    .gallery {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto 70px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
      background: #fff;
    }

    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .back {
      text-align: center;
      margin-bottom: 60px;
    }

    .back a {
      display: inline-block;
      background: #d71920;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background: #171717;
      color: white;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 700px) {
      header {
        padding: 12px 15px;
      }

      header img {
        width: 125px;
      }

      .phone {
        font-size: 14px;
        padding: 12px 14px;
      }

      .hero {
        padding: 40px 15px 25px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      .gallery {
        grid-template-columns: 1fr;
        width: 92%;
      }

      .gallery-item img {
        height: 240px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">
    <img src="logo.png" alt="M.D Rénovation">
  </a>

  <a class="phone" href="tel:0652020458">
    06 52 02 04 58
  </a>
</header>

<section class="hero">
  <h1>Nos <span>réalisations</span></h1>

  <p>
    Découvrez quelques-unes des réalisations de M.D Rénovation
    en Essonne et dans les communes voisines.
  </p>
</section>

<section class="gallery">

  <div class="gallery-item">
    <img src="clim-exterieur.jpg" alt="Pose de climatisation extérieure">
  </div>

  <div class="gallery-item">
    <img src="clim-interieur.jpg" alt="Pose de climatisation intérieure">
  </div>

  <div class="gallery-item">
    <img src="combles-amenages-1.jpg" alt="Aménagement de combles">
  </div>

  <div class="gallery-item">
    <img src="combles-amenages-2.jpg" alt="Rénovation de combles">
  </div>

  <div class="gallery-item">
    <img src="combles-amenages-3.jpg" alt="Travaux d'aménagement de combles">
  </div>

  <div class="gallery-item">
    <img src="combles-amenages-4.jpg" alt="Réalisation de combles aménagés">
  </div>

  <div class="gallery-item">
    <img src="garage-avant.jpg" alt="Rénovation de garage avant travaux">
  </div>

  <div class="gallery-item">
    <img src="garage-isolation.jpg" alt="Isolation de garage">
  </div>

  <div class="gallery-item">
    <img src="garage-placo.jpg" alt="Pose de placo dans un garage">
  </div>

  <div class="gallery-item">
    <img src="garage-finitions.jpg" alt="Finitions de garage">
  </div>

  <div class="gallery-item">
    <img src="salle-de-bain-1.jpg" alt="Rénovation de salle de bain">
  </div>

  <div class="gallery-item">
    <img src="salle-de-bain-2.jpg" alt="Réalisation de salle de bain">
  </div>

  <div class="gallery-item">
    <img src="cuisine.jpg" alt="Rénovation de cuisine">
  </div>

</section>

<div class="back">
  <a href="index.html">← Retour au site</a>
</div>

<footer>
  © M.D RÉNOVATION - Rénovation intérieure et extérieure en Essonne
</footer>

</body>
</html>
